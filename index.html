<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fast2SMS OTP Test</title>
<style>
body {
  background: #001F18;
  color: white;
  font-family: Arial, sans-serif;
  padding: 25px 15px;
  text-align: center;
}
.box {
  max-width: 380px;
  margin: 35px auto;
  padding: 22px;
  background: #06382D;
  border-radius: 16px;
}
input, button {
  width: 100%;
  box-sizing: border-box;
  padding: 14px;
  margin: 9px 0;
  border: 0;
  border-radius: 8px;
  font-size: 16px;
}
button {
  background: #1769FF;
  color: white;
  font-weight: bold;
}
#msg { overflow-wrap: anywhere; }
</style>
</head>
<body>
<div class="box">
  <h2>ModeLuxe Mart</h2>
  <h3>Fast2SMS OTP Test</h3>

  <input id="phone" type="tel" maxlength="10"
    placeholder="10 अंकों का मोबाइल नंबर">

  <button onclick="sendOTP()">OTP भेजें</button>

  <input id="otp" type="text" maxlength="6"
    placeholder="SMS में आया OTP">

  <button onclick="verifyOTP()">OTP Verify करें</button>

  <p id="msg">पहले अपना मोबाइल नंबर डालें।</p>
</div>

<script>
const API = "https://fast2sms.vaishumodeluxe.workers.dev";
let requestId = "";

async function sendOTP() {
  const phone = document.getElementById("phone").value.trim();
  const msg = document.getElementById("msg");

  if (!/^[6-9]\d{9}$/.test(phone)) {
    msg.textContent = "सही 10 अंकों का मोबाइल नंबर डालें।";
    return;
  }

  msg.textContent = "OTP भेजने की कोशिश हो रही है...";

  try {
    const response = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        action: "send",
        phoneNumber: phone
      })
    });

    const data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error(data.message || "OTP नहीं भेजा जा सका।");
    }

    requestId = data.requestId;
    msg.textContent =
      "OTP भेजने की request स्वीकार हुई। SMS आने का इंतज़ार करें।";
  } catch (error) {
    msg.textContent = "Error: " + error.message;
  }
}

async function verifyOTP() {
  const otpCode = document.getElementById("otp").value.trim();
  const msg = document.getElementById("msg");

  if (!requestId) {
    msg.textContent = "पहले OTP भेजें।";
    return;
  }

  if (!/^\d{6}$/.test(otpCode)) {
    msg.textContent = "6 अंकों का OTP डालें।";
    return;
  }

  msg.textContent = "OTP verify हो रहा है...";

  try {
    const response = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        action: "verify",
        requestId: requestId,
        otpCode: otpCode
      })
    });

    const data = await response.json();

    if (!response.ok || !data.verified) {
      throw new Error(data.message || "OTP verify नहीं हुआ।");
    }

    msg.textContent = "सफल! OTP verify हो गया।";
  } catch (error) {
    msg.textContent = "Error: " + error.message;
  }
}
</script>
</body>
</html>
